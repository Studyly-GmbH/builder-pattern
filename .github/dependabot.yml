version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: testing
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vienna
    # Must stay > min-release-age in .npmrc, otherwise npm rejects the version Dependabot picked
    # (one day margin: npm counts exact 24h periods while Dependabot runs at a fixed time)
    cooldown:
      default-days: 15
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Majors need code/config migrations Dependabot can't do; they are done together during the Angular update
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Kept on the same TypeScript minor as the webapp, which is bound to the Angular version
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
